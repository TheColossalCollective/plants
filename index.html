<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>False Indigo Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; }
        #map { height: 400px; border-radius: 12px; margin-bottom: 15px; border: 2px solid #e0e0e0; z-index: 1; cursor: crosshair; }
        .controls { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
        h3 { margin-top: 0; color: #2d4a22; font-size: 1.3rem; }
        button { background: #2e7d32; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; margin-bottom: 5px; }
        .secondary-btn { background: #555; margin-top: 5px; }
        button:disabled { background: #a5d6a7; cursor: not-allowed; }
        input { width: 100%; box-sizing: border-box; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        #status { font-size: 0.9rem; margin-top: 10px; color: #555; text-align: center; font-weight: 500; padding: 5px; border-radius: 4px; }
        .gps-active { background: #e8f5e9; color: #2e7d32 !important; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>False Indigo Tracker</h3>
        <p style="font-size: 0.8rem; margin: 0 0 10px 0;">Click the map to place a pin manually, or use your GPS.</p>
        <input type="text" id="notes" placeholder="Notes (e.g. 10 plants found)">
        <button id="submitBtn">🚀 Submit Selected Location</button>
        <button id="gpsBtn" class="secondary-btn">🎯 Use My Live GPS</button>
        <p id="status">Loading sightings...</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzz-OUMsUxC9EOI494bkxtUzeDl0rNZXZ5CLzrxY9ENyogkQvXuuzIsXgkWws4QJSW8/exec';
        
        const map = L.map('map').setView([43.6150, -116.2023], 11); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let selectedLat = null;
        let selectedLng = null;
        let tempMarker = L.marker([0,0], {opacity: 0}).addTo(map); // Hidden at start

        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const gpsBtn = document.getElementById('gpsBtn');

        // --- LOAD EXISTING PINS ---
        function loadPins() {
            fetch(SCRIPT_URL).then(r => r.json()).then(data => {
                data.forEach(row => {
                    if (row[1] && row[2]) {
                        L.marker([row[1], row[2]]).addTo(map)
                         .bindPopup(`<b>Reported:</b> ${new Date(row[0]).toLocaleDateString()}<br>${row[3] || ""}`);
                    }
                });
                status.innerText = "Map ready. Click map or use GPS.";
            }).catch(e => status.innerText = "Ready (Offline Mode)");
        }
        loadPins();

        // --- OPTION 1: CLICK ON MAP ---
        map.on('click', function(e) {
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;
            tempMarker.setLatLng(e.latlng).setOpacity(1).bindPopup("Selected Location").openPopup();
            status.innerText = `Location set to: ${selectedLat.toFixed(4)}, ${selectedLng.toFixed(4)}`;
            status.className = ""; 
        });

        // --- OPTION 2: USE GPS ---
        gpsBtn.onclick = () => {
            status.innerText = "🛰️ Finding GPS...";
            navigator.geolocation.getCurrentPosition((pos) => {
                selectedLat = pos.coords.latitude;
                selectedLng = pos.coords.longitude;
                map.setView([selectedLat, selectedLng], 15);
                tempMarker.setLatLng([selectedLat, selectedLng]).setOpacity(1).bindPopup("Your GPS Location").openPopup();
                status.innerText = "🎯 GPS Location Locked";
                status.className = "gps-active";
            }, (err) => {
                status.innerText = "❌ GPS Error: " + err.message;
            });
        };

        // --- SUBMIT FINAL CHOICE ---
        submitBtn.onclick = () => {
            if (!selectedLat || !selectedLng) {
                status.innerText = "⚠️ Please click the map first!";
                return;
            }

            submitBtn.disabled = true;
            status.innerText = "💾 Saving to Sheet...";

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ lat: selectedLat, lng: selectedLng, notes: document.getElementById('notes').value })
            }).then(() => {
                status.innerText = "✅ Saved successfully!";
                L.marker([selectedLat, selectedLng]).addTo(map).bindPopup("Saved!").openPopup();
                document.getElementById('notes').value = "";
                submitBtn.disabled = false;
                selectedLat = null; // Reset
            });
        };
    </script>
</body>
</html>
