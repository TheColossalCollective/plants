<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>False Indigo Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; }
        #map { height: 400px; border-radius: 12px; margin-bottom: 15px; border: 2px solid #e0e0e0; z-index: 1; }
        .controls { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
        h3 { margin-top: 0; color: #2d4a22; font-size: 1.3rem; }
        button { background: #2e7d32; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:active { background: #1b5e20; }
        button:disabled { background: #a5d6a7; cursor: not-allowed; }
        input { width: 100%; box-sizing: border-box; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        #status { font-size: 0.9rem; margin-top: 10px; color: #555; text-align: center; font-weight: 500; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>False Indigo Locator</h3>
        <input type="text" id="notes" placeholder="Optional: Note about the sighting">
        <button id="submitBtn">📍 Log My Current Location</button>
        <p id="status">Initializing map...</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Your unique Google Script URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzz-OUMsUxC9EOI494bkxtUzeDl0rNZXZ5CLzrxY9ENyogkQvXuuzIsXgkWws4QJSW8/exec';
        
        // Initialize map centered on Boise
        const map = L.map('map').setView([43.6150, -116.2023], 11); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // --- LOAD EXISTING SIGHTINGS FROM GOOGLE SHEET ---
        function loadPins() {
            status.innerText = "Loading sightings from database...";
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    // We expect an array of arrays: [[Timestamp, Lat, Lng, Note], ...]
                    data.forEach(row => {
                        const lat = row[1];
                        const lng = row[2];
                        const note = row[3] || "Invasive False Indigo";
                        const date = new Date(row[0]).toLocaleDateString();

                        if (lat && lng) {
                            L.marker([lat, lng])
                             .addTo(map)
                             .bindPopup(`<b>Sighting</b><br>${note}<br><small>Reported: ${date}</small>`);
                        }
                    });
                    status.innerText = "All sightings loaded!";
                })
                .catch(err => {
                    console.error("Load error:", err);
                    status.innerText = "Map loaded. Ready for new entries.";
                });
        }

        // Run the load function immediately
        const status = document.getElementById('status');
        loadPins();

        // --- SUBMIT NEW SIGHTING ---
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.onclick = () => {
            if (!navigator.geolocation) {
                status.innerText = "❌ GPS not supported on this device.";
                return;
            }

            submitBtn.disabled = true;
            status.innerText = "🛰️ Finding your location...";

            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const notes = document.getElementById('notes').value;

                status.innerText = "💾 Saving to Google Sheet...";

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Essential for Google Apps Script cross-domain
                    cache: 'no-cache',
                    body: JSON.stringify({ lat, lng, notes })
                })
                .then(() => {
                    status.innerText = "✅ Success! Point added.";
                    // Add the marker to the map immediately
                    L.marker([lat, lng]).addTo(map)
                        .bindPopup("<b>New Entry Saved!</b><br>" + (notes || ""))
                        .openPopup();
                    
                    // Center map on the new point
                    map.setView([lat, lng], 14);
                    document.getElementById('notes').value = "";
                    submitBtn.disabled = false;
                })
                .catch(err => {
                    status.innerText = "❌ Connection error.";
                    submitBtn.disabled = false;
                });

            }, (err) => {
                status.innerText = "❌ GPS Error: " + err.message;
                submitBtn.disabled = false;
            }, { enableHighAccuracy: true });
        };
    </script>
</body>
</html>
